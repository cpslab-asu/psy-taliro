name: Lint

on:
  workflow_call:
  push:

env:
  UV_NO_DEV: True # Disable dev dependency group in all jobs

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
      - name: Setup environment
        run: uv sync --group lint
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .

  pyrefly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.10"
      - name: Check types
        run: uv run --group types --group tests --group examples pyrefly check --output-format=github
