name: Lint

on:
  workflow_call:
  push:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.12"
      - name: Lint
        run: uv run --no-dev --group lint ruff check .
      - name: Format
        run: uv run --no-dev --group lint ruff format --check .

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.10"
      - name: Check types
        run: uv run --no-dev --group types mypy
